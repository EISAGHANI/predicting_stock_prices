<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prediction</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Stock Prediction with MLflow</h1>
        <form class="form-inline" action="/predict" method="post">
            <div class="form-group mb-2">
                <label for="tickerSymbol" class="sr-only">Enter Ticker Symbol:</label>
                <input type="text" class="form-control" id="tickerSymbol" name="tickerSymbol" required>
            </div>
            <button type="submit" class="btn btn-primary mb-2 ml-2">Predict</button>
        </form>
    </div>
</body>
</html>
